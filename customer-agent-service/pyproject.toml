[project]
name = "hmall-customer-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.5.7",
  "fastapi>=0.100,<1",
  "httpx>=0.27,<1",
  "langchain-openai==1.2.1",
  "langgraph-checkpoint-sqlite==3.0.3",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]

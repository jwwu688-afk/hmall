spring:
  datasource:
    url: jdbc:h2:mem:customer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/test-migration
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false

hm:
  internal:
    service-secret: internal-test-secret
  agent:
    token-secret: local-test-token-secret-with-at-least-32-characters
    service-secret: local-test-agent-service-secret
    url: http://127.0.0.1:9

server:
  port: 8087

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:mysql://${HM_DB_HOST:localhost}:3306/hm-customer?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${HM_DB_USERNAME:root}
    password: ${HM_DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}

hm:
  internal:
    service-secret: ${HM_INTERNAL_SERVICE_SECRET}
  agent:
    token-secret: ${HM_AGENT_TOKEN_SECRET}
    service-secret: ${HM_AGENT_SERVICE_SECRET}
    url: ${HM_AGENT_URL:http://127.0.0.1:8001}

feign:
  okhttp:
    enabled: true

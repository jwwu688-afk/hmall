server:
  port: 8080
spring:
  application:
    name: hm-service
  profiles:
    active: dev
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/hmall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 黑马商城接口文档
    description: "黑马商城接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.controller
hm:
  db:
    host: ${HM_DB_HOST:localhost}
    pw: ${HM_DB_PASSWORD}
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: ${HM_JWT_PASSWORD}
    tokenTTL: 30m
  agent:
    token-secret: ${HM_AGENT_TOKEN_SECRET}
    service-secret: ${HM_AGENT_SERVICE_SECRET}
    url: ${HM_AGENT_URL:http://127.0.0.1:8001}
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
      - /internal/customer/**
      - /internal/customer-service/**
      - /customer-service/**
